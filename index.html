<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>파스모 판별기</title>
<style>
:root{
  --bg:#f4f2ec;--surface:#ffffff;--surface2:#ece9e0;--text:#1b1f2a;--muted:#566075;--border:#d4cfc2;
  --accent:#f2a93b;--accent-on:#1a1204;--accent-fg:#8f5400;--danger:#b3261e;--ok:#1f6f3a;
  --warn-bg:#fff4dc;--warn-border:#e0b25a;
  --ev-emf5:#c42b2b;--ev-spiritbox:#0b6bb5;--ev-uv:#7a3fc4;--ev-writing:#8a6d00;--ev-freezing:#0a7c86;--ev-dots:#2b7a2b;--ev-orb:#b45309;
  --shadow:0 1px 2px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1118;--surface:#171c27;--surface2:#1f2634;--text:#e6e8ee;--muted:#a3abbd;--border:#2c3547;
    --accent:#f2a93b;--accent-on:#1a1204;--accent-fg:#f2a93b;--danger:#ff8a80;--ok:#7fd69a;
    --warn-bg:#2a2210;--warn-border:#6b5320;
    --ev-emf5:#ff7a7a;--ev-spiritbox:#6ec1ff;--ev-uv:#c39bff;--ev-writing:#f5d76e;--ev-freezing:#7fe0e6;--ev-dots:#8be08b;--ev-orb:#ffb06a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1118;--surface:#171c27;--surface2:#1f2634;--text:#e6e8ee;--muted:#a3abbd;--border:#2c3547;
  --accent:#f2a93b;--accent-on:#1a1204;--accent-fg:#f2a93b;--danger:#ff8a80;--ok:#7fd69a;
  --warn-bg:#2a2210;--warn-border:#6b5320;
  --ev-emf5:#ff7a7a;--ev-spiritbox:#6ec1ff;--ev-uv:#c39bff;--ev-writing:#f5d76e;--ev-freezing:#7fe0e6;--ev-dots:#8be08b;--ev-orb:#ffb06a;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow-wrap:anywhere}
a{color:var(--accent-fg)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--border);background:var(--surface)}
.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
h1{font-size:1.25rem;margin:0;letter-spacing:-.01em}
.ver{font-size:.8rem;color:var(--muted);margin-top:2px}
button,.btn{font:inherit;color:inherit;cursor:pointer}
.iconbtn{min-width:44px;min-height:44px;border:1px solid var(--border);background:var(--surface2);border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--border)}
nav.tabs .wrap{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;padding-bottom:8px}
nav.tabs a{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--text);border:1px solid transparent}
nav.tabs a:hover{background:var(--surface2)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-on);font-weight:700}
main{padding:16px 0 40px}
.banner{border:1px solid var(--warn-border);background:var(--warn-bg);border-radius:12px;padding:6px 12px;margin:8px 0;font-size:.88rem}
.banner summary{min-height:32px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
details.note{display:inline-block;vertical-align:top}
details.note summary{color:var(--muted)}
.banner small{display:block;color:var(--muted)}
.banners{margin-top:4px}
h2{font-size:1.15rem;margin:22px 0 10px}
h3{font-size:1rem;margin:16px 0 8px}
.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.badge{display:inline-block;font-size:.72rem;line-height:1;padding:4px 7px;border-radius:999px;border:1px solid var(--warn-border);background:var(--warn-bg);color:var(--text);vertical-align:middle;white-space:nowrap}
.badge.conflict{border-color:var(--danger);color:var(--danger);background:transparent}
.cflink{font-size:.78rem;margin-left:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.evgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.evbtn{min-height:56px;padding:8px 10px;border-radius:12px;border:2px solid var(--border);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.evbtn .nm{display:flex;gap:6px;align-items:center;font-weight:700}
.evbtn .en{font-size:.72rem;color:var(--muted);font-weight:400}
.evbtn .st{font-size:.78rem;font-weight:700;color:var(--muted)}
.evbtn svg,.evchip svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.evbtn[data-state="yes"]{border-color:var(--ok);background:var(--surface2)}
.evbtn[data-state="yes"] .st{color:var(--ok)}
.evbtn[data-state="no"]{border-color:var(--danger);opacity:.85}
.evbtn[data-state="no"] .nm span.t{text-decoration:line-through}
.evbtn[data-state="no"] .st{color:var(--danger)}
.ev-emf5{color:var(--ev-emf5)}.ev-spiritbox{color:var(--ev-spiritbox)}.ev-uv{color:var(--ev-uv)}.ev-writing{color:var(--ev-writing)}.ev-freezing{color:var(--ev-freezing)}.ev-dots{color:var(--ev-dots)}.ev-orb{color:var(--ev-orb)}
.evbtn .t,.evchip .t{color:var(--text)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.segbtn{min-height:44px;min-width:44px;padding:6px 14px;border-radius:10px;border:2px solid var(--border);background:var(--surface);font-weight:700}
.segbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn{min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent);font-weight:700}
input[type=search]{min-height:44px;width:100%;padding:6px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit}
.hint{font-size:.82rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:768px){.grid{grid-template-columns:repeat(2,1fr)}.evgrid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1024px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
a.gcard{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
a.gcard:hover{border-color:var(--accent)}
.gname{font-size:1.05rem;font-weight:800}
.gname .en{font-weight:400;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.evchip{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.evchip.fake{border-style:dashed}
.evchip.forced{border-width:2px}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem;margin:4px 0}
.stats b{font-weight:700}
.traits2{margin:6px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
.traits2 li{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reco{border-left:4px solid var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
th button{background:none;border:0;font-weight:700;min-height:32px;padding:0}
td.num,th.num{white-space:nowrap}
details{margin:4px 0}
summary{cursor:pointer;min-height:32px}
.kv{display:grid;grid-template-columns:1fr;gap:2px 12px}
@media (min-width:600px){.kv{grid-template-columns:150px 1fr}}
.kv dt{color:var(--muted)}
.kv dd{margin:0 0 8px}
.trait{padding:8px 0;border-bottom:1px solid var(--border)}
.trait:last-child{border-bottom:0}
.conf{scroll-margin-top:12px}
.conf.hl{outline:3px solid var(--accent)}
.conf ul{margin:6px 0 0;padding-left:18px}
footer{border-top:1px solid var(--border);padding:16px 0 32px;color:var(--muted);font-size:.82rem}
.empty{padding:18px;text-align:center;color:var(--muted)}
.back{display:inline-flex;align-items:center;min-height:44px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div>
    <h1>파스모 판별기</h1>
    <div class="ver" id="ver"></div>
  </div>
  <button class="iconbtn" id="themebtn" type="button" aria-label="다크/라이트 전환" title="다크/라이트 전환"></button>
</div></header>

<div class="wrap"><div class="banners" id="banners" role="region" aria-label="예정 이벤트"></div></div>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap" id="foot"></div></footer>

?oldid=25022","status":"confirmed"}},{"kind":"ability","text_en":{"value":"Turns off lights and breaks lightbulbs more often","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"},"text_ko":{"value":"전등을 끄거나 전구를 깨뜨리는 일이 더 잦다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"}},{"kind":"ability","text_en":{"value":"May turn off a light immediately after a player turns one on","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"},"text_ko":{"value":"플레이어가 전등을 켠 직후에 바로 꺼버릴 수 있다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"}},{"kind":"ability","text_en":{"value":"Wanders more often when lights are on","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"},"text_ko":{"value":"불이 켜져 있을 때 더 자주 돌아다닌다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"Hunts at a lower sanity threshold in a lit room","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"},"text_ko":{"value":"불이 켜진 방에서는 더 낮은 정신력 기준으로 사냥한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"If the lights are turned off, the hunt sanity threshold is increased to 60%, and if the lights are turned on, the threshold is decreased to 40%.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"},"text_ko":{"value":"유령이 있는 방의 불이 꺼져 있으면 사냥 기준이 60%, 켜져 있으면 40%가 된다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Mare?oldid=25022","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"Mares cannot interact with lights 부터 존재한 초기 유령. 위키 이력 최초 기록 2020-03-18(이미 존재). 추가 버전 문자열 확인 불가"},"wiki":{"title":"Mare","revid":25022}},{"id":"moroi","name":{"en":"Moroi","ko":{"value":"모로이","source":"community","source_ref":"data/sources/tybayn_ko_2026-10-02.md","status":"needs_ingame","ingame_id":"IG-002","note":"tybayn ko 표기(나무위키와 대조)"}},"evidence":{"value":["freezing","writing","spiritbox"],"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Evidence?oldid=24466","status":"confirmed","note":"나무위키는 증거 조합 미수록이라 대조 불가"},"fake_evidence":{"value":[],"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"forced_evidence":{"value":"spiritbox","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"},"speed":{"value":{"base":null,"min":1.5,"max":2.25,"los_accel":true,"conditions":[{"when":"Average sanity >= 45%","value":1.5},{"when":"Average sanity 40% - 45%","value":1.583},{"when":"Average sanity 35% - 40%","value":1.66},{"when":"Average sanity 30% - 35%","value":1.749},{"when":"Average sanity 25% - 30%","value":1.832},{"when":"Average sanity 20% - 25%","value":1.915},{"when":"Average sanity 15% - 20%","value":1.998},{"when":"Average sanity 10% - 15%","value":2.081},{"when":"Average sanity 5% - 10%","value":2.164},{"when":"Average sanity 0% - 5%","value":2.25}]},"unit":"m/s","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed","conflict_id":"C-003","note":"고정 기본속도 없음(평균 정신력 구간 의존, 헌트 중 실시간 변경) → base null. 나무위키 표 최저값 1.4 m/s로 위키·tybayn 1.5와 다름(나무위키 각주는 1.5~3.7). 3.71 m/s(LoS 최대)는 max에서 제외. 구간 경계 포함 여부는 위키 표기 그대로","ingame_id":"IG-010"},"hunt_sanity":{"value":{"default":50,"conditions":[]},"unit":"%","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed","note":"Not in the Hunt threshold table (standard); Moroi page states average hunt threshold of 50%"},"traits":[{"kind":"strength","text_en":{"value":"Hunting speeds depend directly on average team sanity","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"},"text_ko":{"value":"사냥 속도가 팀 평균 정신력에 따라 직접 달라진다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"}},{"kind":"ability","text_en":{"value":"Can curse players through the spirit box or the parabolic microphone, making them lose sanity faster","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"},"text_ko":{"value":"Spirit Box나 Parabolic Microphone으로 플레이어에게 저주를 걸어 정신력이 더 빨리 닳게 한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"Will be disoriented for longer when smudged during a hunt","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"},"text_ko":{"value":"사냥 중 Smudge를 맞으면 방향 감각을 더 오래 잃는다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The base speed increases by an average of 0.083 m/s for every 5% average sanity below its average hunt threshold of 50%.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"},"text_ko":{"value":"평균 정신력이 50% 아래로 5% 내려갈 때마다 기본 속도가 평균 0.083 m/s씩 빨라진다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"By successfully obtaining a response from the Spirit Box; this will curse the person who \"caused\" the response, either by asking questions or triggering the failsafe.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"},"text_ko":{"value":"Spirit Box 응답을 얻으면 그 응답을 일으킨 사람에게 저주가 걸린다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"When a player is cursed, their passive sanity drain is doubled and being in a lit area will no longer prevent sanity drain (i.e. the player is considered in the dark at all times).","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"},"text_ko":{"value":"저주에 걸리면 자연 정신력 감소가 두 배가 되고 밝은 곳에 있어도 감소가 막히지 않는다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"Consuming Sanity Medication removes the curse for that player.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"},"text_ko":{"value":"Sanity Medication을 먹으면 저주가 풀린다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"When using an Incense during a hunt, the duration where the Moroi cannot see nor kill players is 7 seconds instead of 5.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"},"text_ko":{"value":"사냥 중 Incense를 쓰면 Moroi가 보지도 죽이지도 못하는 시간이 7초다(일반은 5초).","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Moroi?oldid=24626","status":"confirmed"}}],"tells":[],"added_in":{"value":"v0.6.2.0","source":"official","source_ref":"data/sources/steam_news_300.json (https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/4480532686351350141)","status":"confirmed","note":"2022-06-10 (Deogen·Thaye와 동시)"},"wiki":{"title":"Moroi","revid":24626}},{"id":"myling","name":{"en":"Myling","ko":{"value":"마일링","source":"community","source_ref":"data/sources/tybayn_ko_2026-10-02.md","status":"needs_ingame","ingam r","text_en":{"value":"It is distinct for being more talkative, but very quiet when hunting.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Myling?oldid=25034","status":"confirmed"},"text_ko":{"value":"평소엔 말이 많지만 사냥 중에는 매우 조용하다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Myling?oldid=25034","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Myling produces a paranormal sound on a Parabolic Microphone or a Sound Recorder every 64 - 127 seconds, instead of every 80 - 127 seconds for other ghosts.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Myling?oldid=25034","status":"confirmed"},"text_ko":{"value":"Parabolic Microphone이나 Sound Recorder에 잡히는 소리를 64~127초마다 낸다(일반 유령은 80~127초).","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Myling?oldid=25034","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"the static noise on the recorder starts 1 metre further away from the source","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Myling?oldid=25034","status":"confirmed"},"text_ko":{"value":"Myling의 소리는 Sound Recorder의 잡음이 소리 근원에서 1m 더 먼 곳부터 시작된다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Myling?oldid=25034","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"When hunting, a Myling's footstep and vocalization sounds will only be audible to players within 12 meters – slightly greater than the range required for electronic interference – instead of the usual 20 meters.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Myling?oldid=25034","status":"confirmed"},"text_ko":{"value":"사냥 중 발소리와 목소리가 12m 안에서만 들린다(일반은 20m).","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Myling?oldid=25034","status":"confirmed"}}],"tells":[],"added_in":{"value":"v0.3.0","source":"official","source_ref":"data/sources/steam_news_300.json (https://steamstore-a.akamaihd.net/news/externalpost/stea wiki/Obake?oldid=24341","status":"confirmed"},"text_ko":{"value":"가끔 지문을 남기지 않는다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"}},{"kind":"ability","text_en":{"value":"Has a chance to blink in a different ghost model when hunting","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"},"text_ko":{"value":"사냥 중 깜빡일 때 다른 유령 모델로 바뀔 때가 있다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"Can leave a unique fingerprint pattern","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"},"text_ko":{"value":"독특한 모양의 지문을 남길 수 있다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"Each time the Obake interacts with a valid surface, it has a 75% chance of leaving fingerprints, instead of the usual 100%.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"},"text_ko":{"value":"유효한 표면을 건드릴 때 지문을 남길 확률이 75%다(일반은 100%).","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"there is a one-sixth (~16.7%) chance for the Obake to create a unique handprint/fingerprint pattern:","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"},"text_ko":{"value":"손자국이나 지문을 남길 때 약 16.7% 확률로 특이한 모양이 나온다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"A six-fingered handprint instead of the usual five fingers","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"},"text_ko":{"value":"특이한 모양 중 하나는 손가락이 여섯 개인 손자국이다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Obake occasionally triggers an ability to reduce the remaining time for all existing fingerprints on the map by half.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"},"text_ko":{"value":"가끔 능력을 써서 맵에 남은 모든 지문의 남은 시간을 절반으로 줄인다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"the Obake will occasionally shapeshift into a different ghost model of the same gender on one visibility timer before returning to its normal model on the following visibility timer.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"},"text_ko":{"value":"사냥 중 깜빡일 때 가끔 같은 성별의 다른 유령 모델로 변했다가 다음에 원래 모델로 돌아온다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"A shapeshift will always occur on the 12th, 27th, 39th, 54th, 62nd, 80th, 105th, and 120th visibility timers of a hunt.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"},"text_ko":{"value":"변신은 사냥 중 보이는 구간의 12, 27, 39, 54, 62, 80, 105, 120번째에 반드시 일어난다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obake?oldid=24341","status":"confirmed"}}],"tells":[],"added_in":{"value":"v0.4.0","source":"official","source_ref":"data/sources/steam_news_300.json (https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/4103335143120323518)","status":"confirmed","note":"2021-10-25 (Onryo·The Twins·Raiju와 동시)"},"wiki":{"title":"Obake","revid":24341}},{"id":"obambo","name":{"en":"Obambo","ko":{"value":"오밤보","source":"community","source_ref":"data/sources/  사냥을 더 늦게 시작하고 더 느리다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"Hunts initiated in its \"aggressive\" state have a reduced duration","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"},"text_ko":{"value":"aggressive 상태에서 시작한 사냥은 지속 시간이 짧다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Obambo has two states: \"calm\" and \"aggressive\". It always starts in the calm state at the beginning of a contract before switching to the other state 1 minute after an exit door is opened for the first time, then every 2 minutes.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"},"text_ko":{"value":"calm과 aggressive 두 상태가 있으며, 항상 calm으로 시작해 출입문이 처음 열리고 1분 뒤 상태가 바뀌고 이후 2분마다 바뀐다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"In its calm state, the Obambo has a fixed activity level of 90. In its aggressive state, it has a fixed activity level of 25.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"},"text_ko":{"value":"활동 수치는 calm 상태에서 90, aggressive 상태에서 25로 고정이다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Obambo has a hunt sanity threshold of 10% while in its calm state, and of 65% in its aggressive state.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"},"text_ko":{"value":"사냥 기준은 calm 상태에서 10%, aggressive 상태에서 65%다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Obambo will travel at a base speed of 1.445 m/s in its calm state and at a base speed of 1.955 m/s in its aggressive state.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"},"text_ko":{"value":"기본 속도는 calm 상태에서 1.445 m/s, aggressive 상태에서 1.955 m/s다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The hunt duration will be 20% shorter if the Obambo starts the hunt in the aggressive state.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"},"text_ko":{"value":"aggressive 상태에서 사냥을 시작하면 사냥 지속 시간이 20% 짧아진다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Obambo?oldid=24274","status":"confirmed"}}],"tells":[],"added_in":{"value":"v0.15.1.0","source":"official","source_ref":"data/sources/steam_news_300.json (https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1818752592135575)","status":"confirmed","note":"2025-12-16 (Winter's Jest). 공식 공지는 이름을 숨기고 'unidentified ghost types'로만 언급(Dayan·Gallu와 동시)"},"wiki":{"title":"Obambo","revid":24274}},{"id":"oni","name":{"en":"Oni","ko":{"value":"오니","source":"community","source_ref":"data/sources/tybayn_ko_2026-10-02.md","status":"needs_ingame","ingame_id":"IG-002","note":"tybayn ko 표기(나무위키와 대조)"}},"evidence":{"value":["dots","emf5","freezing"],"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Evidence?oldid=24466","status":"confirmed","note":"나무위키는 증거 조합 미수록이라 대조 불가"},"fake_evidence":{"value":[],"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Oni?oldid=24610","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"forced_evidence":{"value":null,"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Evidence?oldid=24466","stat s://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"}},{"kind":"ability","text_en":{"value":"Produces mist and shadow form ghost events more often","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"},"text_ko":{"value":"mist form과 shadow form 고스트 이벤트를 더 자주 한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"Has a low hunt sanity threshold","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"},"text_ko":{"value":"사냥 정신력 기준이 낮다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"Generally unwilling to hunt and perform interactions in the presence of players","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"},"text_ko":{"value":"플레이어가 있으면 보통 사냥도 상호작용도 하지 않으려 한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Shade can only hunt below an average sanity of 35%, lower than most other ghosts.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"},"text_ko":{"value":"평균 정신력이 35% 아래일 때만 사냥한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"If at least one player is in the same room as a Shade, it will be unable to perform interactions (including the fuse box and interactions forced through the Voodoo Doll), ghost events, or initiate hunts, regardless of average sanity","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"},"text_ko":{"value":"같은 방에 플레이어가 한 명이라도 있으면 상호작용, 고스트 이벤트, 사냥 시작을 모두 하지 못한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"At 100% average sanity, it has a 0% chance of successfully performing an event. This success rate increases by 2% per percentage of average sanity lost; at an average sanity of 50%, an attempted ghost event will always succeed.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"},"text_ko":{"value":"평균 정신력 100%에서는 이벤트 성공률이 0%이고, 1% 줄 때마다 2%씩 올라 50%에서는 항상 성공한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"When manifesting during a ghost event, the Shade has a 2/3 chance to appear in its shadow form instead of a full or translucent form.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"},"text_ko":{"value":"고스트 이벤트 중 모습을 드러낼 때 2/3 확률로 그림자 모습으로 나타난다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Shade cannot perform singing and appear events. It also has a 60% chance to perform the mist form event instead of 20% for other ghosts.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"},"text_ko":{"value":"singing 이벤트와 appear 이벤트는 하지 않고, mist form 이벤트는 60% 확률로 한다(일반 유령은 20%).","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Shade?oldid=23207","status":"confirmed"}}],"tells":[],"added_in":{"value":"pre-EA","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Shade","status":"unverified","note":"앞서 해보기 출시(2020-09-18) 이전 알파부터 존재. 버전 번호 없음. 위키: Early Access Alpha 2020-03-24 추가. Steam 정식 앞서 해보기(2020-09-18) 이전 알파 빌드라 v0.x.x.x 버전 문자열을 찾지 못해 null. 앞서 해보기 출시 시점부터 존재."},"wiki":{"title":"Shade"," 에 띄는 강점이 없다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Spirit?oldid=23120","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"it will not be able to initiate a hunt for 180 seconds instead of 90 seconds with most other ghosts.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Spirit?oldid=23120","status":"confirmed"},"text_ko":{"value":"근처에서 Incense를 쓰면 180초 동안 사냥하지 못한다(일반 유령은 90초).","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Spirit?oldid=23120","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"This delay will also apply if the Spirit was smudged during a hunt.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Spirit?oldid=23120","status":"confirmed"},"text_ko":{"value":"사냥 중에 Smudge를 맞았을 때도 이 지연 시간이 똑같이 적용된다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Spirit?oldid=23120","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"Spirits have no other special behaviour.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Spirit?oldid=23120","status":"confirmed"},"text_ko":{"value":"그 밖의 특별한 행동은 없다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Spirit?oldid=23120","status":"confirmed"}}],"tells":[],"added_in":{"value":"pre-EA","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Spirit","status":"unverified","note":"앞서 해보기 출시(2020-09-18) 이전 알파부터 존재. 버전 번호 없음. 위키에 추가 행 없음, 2020-03-13 이전부터 존재(알파 초기 유령). Steam 정식 앞서 해보기(2020-09-18) 이전 알파 빌드라 v0.x.x.x 버전 문자열을 찾지 못해 null. 앞서 해보기 출시 시점부터 존재."},"wiki":{"title":"Spirit","revid":23120}},{"id":"thaye","name":{"en":"Thaye","ko":{"value":"타예","source":"community","source_ref":"data/sources/tybayn_ko_2026-10-02.md","status":"needs_ingame","ingame_id":"IG-002","note":"tybayn ko 표기(나무위키와 대조)"}},"evidence":{"value":["dots","orb","writing"],"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status" ce":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"},"text_ko":{"value":"플레이어가 근처에 오래 머물수록 점점 조용해지고 느려진다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Thaye is more likely to interact with doors compared to most other ghosts (30% chance instead of the 25% chance for a standard ghost).","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"},"text_ko":{"value":"문을 건드릴 확률이 30%다(일반 유령은 25%).","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Thaye will attempt to age 1 minute after an exit door is opened for the first time; if at least one player is in the same room as the ghost or within 3 meters of it,","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"},"text_ko":{"value":"출입문이 처음 열리고 1분 뒤부터 나이를 먹으려 하며, 같은 방이나 3m 안에 플레이어가 있을 때 나이가 1 늘어난다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"When the Thaye chooses to perform a ghost event, it has a chance of (1 - age / 9) of succeeding.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"},"text_ko":{"value":"고스트 이벤트 성공 확률은 (1 - 나이/9)로, 나이를 먹을수록 낮아진다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"This means it will no longer be able to perform ghost events after using its ability 9 times, unless forced through the use of cursed possessions.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"},"text_ko":{"value":"능력을 9번 쓰면 Cursed Possession으로 강제하지 않는 한 고스트 이벤트를 더는 하지 못한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"Instead of having an increased chance of hunting the lower the average sanity, the Thaye always has a fixed chance of 1/8 of initiating a hunt after exiting an idle state below the hunt sanity threshold.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"},"text_ko":{"value":"정신력이 낮아져도 사냥 확률이 오르지 않고, 기준 이하에서 대기 상태를 벗어날 때마다 1/8 확률로 사냥을 시작한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"Unlike most other ghosts, the Thaye does not speed up with line-of-sight of a player.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"},"text_ko":{"value":"다른 유령과 달리 플레이어가 보여도 속도가 빨라지지 않는다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Thaye?oldid=23537","status":"confirmed"}}],"tells":[],"added_in":{"value":"v0.6.2.0","source":"official","source_ref":"data/sources/steam_news_300.json (gid 4480532686351350141; https://store.steampowered.com/news/app/739630/view/4480532686351350141)","status":"confirmed","note":"2022-06-10 (v0.6.2.0, Deogen·Moroi와 함께)."},"wiki":{"title":"Thaye","revid":23537}},{"id":"the-mimic","name":{"en":"The Mimic","ko":{"value":"미믹","source":"community","source_ref":"data/sources/tybayn_ko_2026-10-02.md","status":"needs_ingame","ingame_id":"IG-002","note":"tybayn ko 표기(나무위키와 대조)"}},"evidence":{"value":["freezing","spiritbox","uv"],"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"confirmed","note":"나무위키는 증거 조합이 없어 대조에서 제외(불일치 아님)."},"fake_evidence":{"value":["orb"],"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"confirmed","note":"저널 증거 입력에는 반영되지 않음(위키)."},"forced_evidence":{"value":null,"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Evidence?oldid=24466","status":"confirmed","note":"보장 증거가 있는 유령은 Deogen·Goryo·Hantu·Moroi·Obake뿐(위키 Evidence 표). Mimic의 가짜 고스트 오브는 '보장 증거'와 별개(항상 추가 표시)."},"speed":{"value":{"base":1.7,"min":null,"max":null,"los_accel":true,"conditions":[{"when":"While mimicking another ghost type: copies that ghost's hunt movement speed and speed rules (incl. LoS behaviour)","value":"inherited"}]},"unit":"m/s","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Hunt?oldid=25026","status":"unverified","note":"모방 중인 유령 속도를 따름"},"hunt_sanity":{"value":{"default":50,"conditions":[{"when":"While mimicking another ghost type: inherits that ghost's threshold (lowest possible, e.g. Obambo calm state)","value":10},{"when":"While mimicking another ghost type: inherits that ghost's threshold/abilities (highest; e.g. Demon ability or Onryo hunts regardless of sanity)","value":100}]},"unit":"%","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"unverified","note":"모방 중인 유령 값을 따름. 시작(blank) 상태 50%는 단일 출처","ingame_id":"IG-012"},"traits":[{"kind":"strength","text_en":{"value":"Mimics other ghost types one after another for brief periods of time","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"confirmed"},"text_ko":{"value":"다른 유령 종류를 짧은 시간 동안 차례로 흉내 낸다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"Will always produce false ghost orbs","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"confirmed"},"text_ko":{"value":"항상 가짜 Ghost Orb을 만든다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Mimic is able to imi 모델이면 Banshee나 Dayan은 흉내 내지 못한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Mimic provides \"evidence\" of Ghost Orbs in addition to its three main evidence types","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"confirmed"},"text_ko":{"value":"기본 증거 세 가지 외에 Ghost Orb도 증거처럼 항상 나타난다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Mimic?oldid=25023","status":"confirmed"}}],"tells":[],"added_in":{"value":"v0.5.0","source":"official","source_ref":"data/sources/steam_news_300.json (gid 4224936849654448275; https://store.steampowered.com/news/app/739630/view/4224936849654448275)","status":"confirmed","note":"2021-12-10 (v0.5.0). 공식 공지는 도입부에서 'strange new ghost type'으로 이름을 숨기고 본문 목록에서 The Mimic을 명시."},"wiki":{"title":"The Mimic","revid":25023}},{"id":"the-twins","name":{"en":"The Twins","ko":{"value":"트윈스","source":"community","source_ref":"data/sources/tybayn_ko_2026-10-02.md","status":"needs_ingame","ingame_id":"IG-002","note":"tybayn ko 표기(나무위키와 대조)"}},"evidence":{"value":["emf5","freezing","spiritbox"],"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed","note":"나무위키는 증거 조합이 없어 대조에서 제외(불일치 아님)."},"fake_evidence":{"value":[],"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"forced_evidence":{"value":null,"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"speed":{"value":{"base":1.7,"min":null,"max":null,"los_accel":true,"conditions":[{"when":"slow twin chosen (50% chance), fixed modifier -0.2 m/s applied after LoS acceleration","value":1.5},{"when":"fast twin chosen (50% chance), fixed modifier +0.2 m/s applied after LoS acceleration","value":1.9}]},"unit":"m/s","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed","note":"±0.2 보정이 LoS 가속 뒤에 더해져 최고 2.605 / 3.005 m/s(위키). 위키 각주: 빠른 쪽 선택 시 원거리 상호작용 위치로 순간이동하지 못하는 버그가 있음. 공통 규칙(Blood Moon 날씨 시 속도 +15%)은 유령 고유 조건이 아니므로 conditions에서 제외."},"hunt_sanity":{"value":{"default":50,"conditions":[]},"unit":"%","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Hunt?oldid=25046","status":"confirmed","note":"표준 임계치 행('All other ghosts/standard', Always, 50). The Twins는 Hunt 표에 별도 행이 없고 문서에도 비표준 임계치 언급 없음"},"traits":[{"kind":"strength","text_en":{"value":"Can hunt from a different place than expected","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed"},"text_ko":{"value":"예상과 다른 위치에서 사냥을 시작할 수 있다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed"}},{"kind":"ability","text_en":{"value":"Differing speeds depending on which twin hunts","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed"},"text_ko":{"value":"어느 쪽 쌍둥이가 사냥하느냐에 따라 속도가 다르다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"Can interact with the environment simultaneously","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed"},"text_ko":{"value":"환경에 동시에 상호작용할 수 있다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"Despite its name and accompanying flavor text, mechanically, The Twins is simply one ghost.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed"},"text_ eed is 1.7 m/s with a fixed modifier of ±0.2 m/s depending on whether it chose the slow (effective 1.5 m/s) or the fast (effective 1.9 m/s) speed.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed"},"text_ko":{"value":"기본 속도 1.7 m/s에 느린 쪽은 1.5 m/s, 빠른 쪽은 1.9 m/s로 ±0.2 m/s가 붙는다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/The_Twins?oldid=25016","status":"confirmed"}}],"tells":[],"added_in":{"value":"v0.4.0","source":"official","source_ref":"data/sources/steam_news_300.json (gid 4103335143120323518; https://store.steampowered.com/news/app/739630/view/4103335143120323518)","status":"confirmed","note":"2021-10-25 (v0.4.0)."},"wiki":{"title":"The Twins","revid":25016}},{"id":"wraith","name":{"en":"Wraith","ko":{"value":"레이스","source":"community","source_ref":"data/sources/tybayn_ko_2026-10-02.md","status":"needs_ingame","ingame_id":"IG-002","note":"tybayn ko 표기(나무위키와 대조)"}},"evidence":{"value":["dots","emf5","spiritbox"],"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Wraith?oldid=23023","status":"confirmed","note":"나무위키는 증거 조합이 없어 대조에서 제외(불일치 아님)."},"fake_evidence":{"value":[],"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Wraith?oldid=23023","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"forced_evidence":{"value":null,"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Wraith?oldid=23023","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"speed":{"value":{"base":1.7,"min":null,"max":null,"los_accel":true,"conditions":[]},"unit":"m/s","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Hunt?oldid=25046","status":"confirmed","note":"표준 속도 유령(Hunt 문서의 예외 목록에 없음). 공통 규칙(Blood Moon 날씨 시 속도 +15%)은 유령 고유 조건이 아니므로 conditions에서 제외."},"hunt_sanity":{"value":{"default":50,"conditions":[]},"unit":"%","source":"wiki","source_ref":"https://phasmophob vel 5 reading instead.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Wraith?oldid=23023","status":"confirmed"},"text_ko":{"value":"사냥 중이 아닐 때 무작위 플레이어에게 순간이동하며, 도착 지점의 플레이어 발 높이에서 EMF 2가 찍히고 33% 확률로 EMF 5가 찍힌다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Wraith?oldid=23023","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"Wraiths cannot and do not: … Float off the ground, whether during hunts or manifestations.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Wraith?oldid=23023","status":"confirmed"},"text_ko":{"value":"사냥 중이든 모습을 드러낼 때든 공중에 뜨지 않는다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Wraith?oldid=23023","status":"confirmed"}}],"tells":[],"added_in":{"value":"pre-EA","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Wraith","status":"unverified","note":"앞서 해보기 출시(2020-09-18) 이전 알파부터 존재. 버전 번호 없음. 위키에 추가 행 없음, 2020-03-18 이전부터 존재(알파 초기 유령). Steam 정식 앞서 해보기(2020-09-18) 이전 알파 빌드라 v0.x.x.x 버전 문자열을 찾지 못해 null. 앞서 해보기 출시 시점부터 존재."},"wiki":{"title":"Wraith","revid":23023}},{"id":"yokai","name":{"en":"Yokai","ko":{"value":"요괴","source":"community","source_ref":"data/sources/tybayn_ko_2026-10-02.md","status":"needs_ingame","ingame_id":"IG-002","note":"tybayn ko 표기(나무위키와 대조)"}},"evidence":{"value":["dots","orb","spiritbox"],"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed","note":"나무위키는 증거 조합이 없어 대조에서 제외(불일치 아님)."},"fake_evidence":{"value":[],"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"forced_evidence":{"value":null,"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"speed":{"value":{"base":1.7,"min":null,"max":null,"los_accel":true,"conditions":[]},"unit":"m/s","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Hunt?oldid=25046","status":"confirmed","note":"표준 속도 유령(Hunt 문서의 예외 목록에 없음). 공통 규칙(Blood Moon 날씨 시 속도 +15%)은 유령 고유 조건이 아니므로 conditions에서 제외."},"hunt_sanity":{"value":{"default":50,"conditions":[{"when":"at least one player uses voice chat in the same room as the Yokai (temporary)","value":80}]},"unit":"%","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"},"traits":[{"kind":"strength","text_en":{"value":"Talking near it will temporarily increase the hunting threshold and interaction rate","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"},"text_ko":{"value":"근처에서 말하면 사냥 정신력 기준과 상호작용 빈도가 일시적으로 올라간다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"When hunting, it can only hear voices and detect electronics within a short range","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"},"text_ko":{"value":"사냥 중에는 가까운 거리의 목소리와 전자기기만 감지한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"Utilizing voice chat in the same room as the Yokai will increase its activity by 30.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"},"text_ko":{"value":"같은 방에서 음성 채팅을 하면 활동 수치가 30 올라간다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"When at least one player uses voice chat in the same room as the Yokai, its hunt sanity threshold is temporarily increased to 80%. Otherwise, it has the standard threshold of 50%.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"},"text_ko":{"value":"같은 방에서 음성 채팅을 하면 사냥 기준이 일시적으로 80%가 되고, 아니면 표준인 50%다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"During hunts, a Yokai can only hear players or sense handheld active electronics that are within 2.5 metres of it. Its line-of-sight is unaffected.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"},"text_ko":{"value":"사냥 중에는 2.5m 안의 플레이어와 손에 든 켜진 전자기기만 감지하며, 시야는 그대로다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The Yokai must be within 2.5 metres of the Music Box to trigger the Music Box event instead of 5 metres for other ghosts.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"},"text_ko":{"value":"Music Box 이벤트는 상자에서 2.5m 안에 있어야 발동한다(일반 유령은 5m).","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yokai?oldid=23421","status":"confirmed"}}],"tells":[],"added_in":{"value":"v0.29.6","source":"official","source_ref":"data/sources/steam_news_300.json (gid 4056035920058794566; https://store.steampowered.com/news/app/739630/view/4056035920058794566)","status":"confirmed","note":"2021-06-18 (main 브랜치, beta 2021-06-17). 공식 공지에는 버전 번호가 없고 버전 'v0.29.6'은 위키(0.29.6 문서·Yokai 이력)에서 옴. 0.3.0 이전의 구 버전 체계."},"wiki":{"title":"Yokai","revid":23421}},{"id":"yurei","name":{"en":"Yurei","ko":{"value":"유레이","source":"community","source_ref":"data/sources/tybayn_ko_2026-10-02.md","status":"needs_ingame","ingame_id":"IG-002","note":"tybayn ko 표기(나무위키와 대조)"}},"evidence":{"value":["dots","freezing","orb"],"source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed","note":"나무위키는 증거 조합이 없어 대조에서 제외(불일치 아님)."},"fake_evidence":{"value":[],"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"forced_evidence":{"value":null,"source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed","note":"부재 판정: 추출(위키 고정 판본)과 독립 검증(위키 최신본·tybayn) 모두 해당 서술 없음"},"speed":{"value":{"base":1.7,"min":null,"max":null,"los_accel":true,"conditions":[]},"unit":"m/s","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Hunt?oldid=25046","status":"confirmed","note":"표준 속도 유령(Hunt 문서의 예외 목록에 없음). 공통 규칙(Blood Moon 날씨 시 속도 +15%)은 유령 고유 조건이 아니므로 conditions에서 제외."},"hunt_sanity":{"value":{"default":50,"conditions":[]},"unit":"%","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Hunt?oldid=25046","status":"confirmed","note":"임계치는 표준. 능력 범위는 출처별 차이: 위키 7.5 m, 나무위키 5 m (질문 범위 밖, 참고)."},"traits":[{"kind":"ability","text_en":{"value":"May randomly shut a door and deduct nearby players' sanity","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"},"text_ko":{"value":"무작위로 문을 닫으면서 근처 플레이어의 정신력을 깎을 수 있다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"}},{"kind":"weakness","text_en":{"value":"Will be temporarily confined to its room after smudging","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"},"text_ko":{"value":"Smudge를 맞으면 한동안 자기 방에 갇힌다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"When Incense is used on the Yurei, in addition to preventing hunts and temporarily increasing activity, every roaming state will be replaced by a favourite room state for 90 seconds","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"},"text_ko":{"value":"Incense를 맞으면 사냥이 막히고 활동이 잠시 늘며, 90초 동안 배회 대신 선호하는 방에 머문다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"When opening or closing a hinged door, it will use a force of 0.6N instead of a 0.01N-0.05N for other ghosts.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"},"text_ko":{"value":"여닫이문을 0.6N의 힘으로 여닫는다(일반 유령은 0.01~0.05N).","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"In practice, this means the Yurei cannot slightly move doors and can only either close them completely, or open them completely.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"},"text_ko":{"value":"그래서 문을 살짝만 움직이지 못하고 완전히 닫거나 완전히 열기만 한다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"All players within 7.5 metres of the ghost will have their sanity decreased by 15%.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"},"text_ko":{"value":"능력을 쓰면 7.5m 안의 모든 플레이어의 정신력이 15% 깎인다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"}},{"kind":"behavior","text_en":{"value":"The ghost will randomly select one opened door in the room and close it fully in a smooth way (as opposed to a strong slam) without any creaking sound.","source":"wiki","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"},"text_ko":{"value":"열려 있는 문 하나를 골라 삐걱거림 없이 부드럽게 완전히 닫는다.","source":"derived","source_ref":"https://phasmophobia.fandom.com/wiki/Yurei?oldid=24593","status":"confirmed"}}],"tells":[],"added_in":{"value":"pre-EA","source":"der     list.forEach(function(m){
      var rv = val(m.facts.restricted_variant);
      h += '<div class="card"><strong>' + esc(nameText(m)) + '</strong>' + badge(m.facts.size) + '<div class="small muted">' + (rv ? 'Restricted 변형 있음' : 'Restricted 변형 없음') + badge(m.facts.restricted_variant) + '</div></div>';
    });
    h += '</div>';
  });
  var rest = F.maps.filter(function(m){ return ['small', 'medium', 'large'].indexOf(val(m.facts.size)) < 0; });
  if (rest.length) h += '<h3>기타</h3>' + rest.map(function(m){ return '<p>' + esc(nameText(m)) + '</p>'; }).join('');
  return h;
}

/* ---------- 난이도 ---------- */
var PARAM_LABEL = [['starting_sanity', '시작 정신력', '%'], ['sanity_drain_x', '정신력 소모 배율', '배'], ['pill_restore', '정신력 약 회복량', '%'], ['evidence_count', '공개 증거 수', '개'], ['setup_time_s', '준비 시간', '초'], ['reward_x', '보상 배율', '배'], ['unlock_level', '해금 레벨', '']];
function viewDifficulty(){
  var diffs = F.difficulties, std = diffs.filter(function(d){ return d.params && d.params.starting_sanity; });
  var h = '<h2>난이도</h2><p class="hint">한국어 난이도 명칭이 확정되지 않아 영문 이름을 쓰고 있습니다.</p><div class="tablewrap"><table><thead><tr><th>항목</th>' +
    std.map(function(d){ return '<th>' + esc(nameText(d)) + '</th>'; }).join('') + '</tr></thead><tbody>';
  PARAM_LABEL.forEach(function(p){
    h += '<tr><th scope="row">' + p[1] + '</th>' + std.map(function(d){
      var f = d.params[p[0]];
      return '<td class="num">' + (f ? esc(val(f)) + p[2] + badge(f) + cflink(f) : '-') + '</td>';
    }).join('') + '</tr>';
  });
  h += '</tbody></table></div><h3>난이도 요약</h3><div class="grid">';
  diffs.forEach(function(d){
    var s = d.params && d.params.summary_ko;
    h += '<div class="card"><strong>' + esc(nameText(d)) + '</strong><p style="margin:6px 0 0">' + (s ? esc(val(s)) + fmeta(s) : '<span class="muted">요약 없음</span>') + '</p></div>';
  });
  h += '</div><h3>공통 헌트 규칙</h3><div class="panel"><ul>';
  Object.keys(RULES).forEach(function(k){
    if (!/_ko$/.test(k)) return;
    h += '<li>' + esc(val(RULES[k])) + fmeta(RULES[k]) + '</li>';
  });
  return h + '</ul></div>';
}

/* ---------- 정보 ---------- */
function countStatus(o, c){
  if (o && typeof o === 'object') {
    if (typeof o.status === 'string' && 'source' in o && 'value' in o) { c[o.status] = (c[o.status] || 0) + 1; return; }
    Object.keys(o).forEach(function(k){ countStatus(o[k], c); });
  }
}
function viewAbout(){
  var g = META.game_version, h = '<h2>정보</h2><div class="panel"><dl class="kv"><dt>기준 버전</dt><dd>PC ' + esc(g.pc) + ' / 콘솔 빌드 ' + esc(g.console_build) + (g.released ? ' (배포 ' + esc(g.released) + ')' : '') + '</dd>' + (needsRecheck(META) ? '<dt>재확인</dt><dd>' + esc(recheckText(META)) + '</dd>' : '') + '<dt>마지막 확인일</dt><dd>' + esc(META.checked_at) + '</dd><dt>유령 수</dt><dd>' + esc(val(META.ghost_count)) + '종</dd></dl></div>';
  h += '<h3>데이터 출처</h3><div class="panel"><ul>';
  Object.keys(META.sources || {}).forEach(function(k){
    var s = META.sources[k], url = s.url || s.api || '';
    h += '<li><strong>' + esc(s.name || k) + '</strong>' + (/^https?:\/\//.test(url) ? ' <a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">링크</a>' : '') + (s.license ? '<div class="small muted">라이선스: ' + esc(s.license) + '</div>' : '') + (s.note ? '<div class="small muted">' + esc(s.note) + '</div>' : '') + '</li>';
  });
  h += '</ul><p class="small">' + esc(META.site.license_text) + '</p></div>';
  var c = {}; countStatus(F, c);
  var tot = 0; Object.keys(c).forEach(function(k){ tot += c[k]; });
  h += '<h3>데이터 상태 분포</h3><div class="panel"><ul>';
  ['confirmed', 'unverified', 'needs_ingame', 'conflict', 'stale'].forEach(function(k){
    if (c[k]) h += '<li>' + (k === 'confirmed' ? '확인됨' : STATUS_LABEL[k]) + ': ' + c[k] + '개 (' + Math.round(c[k] * 100 / tot) + '%)</li>';
  });
  h += '</ul><p class="small muted">전체 ' + tot + '개 값 기준</p></div>';
  h += '<h3>출처 충돌 기록</h3>';
  (DATA.conflicts.intro || []).forEach(function(l){ h += '<p class="small muted">' + esc(l) + '</p>'; });
  DATA.conflicts.items.forEach(function(it){
    h += '<div class="card conf" id="' + esc(it.id) + '" style="margin-bottom:10px"><strong>' + esc(it.id) + ' &mdash; ' + esc(it.title) + '</strong><ul>' +
      it.items.map(function(x){ return '<li>' + (x.k ? '<b>' + esc(x.k) + '</b>: ' : '') + esc(x.v) + '</li>'; }).join('') + '</ul></div>';
  });
  h += '<h3>인게임 확인 목록</h3><p class="hint">사람이 게임에서 직접 확인해야 하는 항목입니다.</p><div class="tablewrap"><table><thead><tr><th>ID</th><th>무엇을</th><th>어떻게</th><th>기대값</th><th>확인 결과</th></tr></thead><tbody>' +
    DATA.checklist.map(function(r){ return '<tr><td>' + esc(r.id) + '</td><td>' + esc(r.what) + '</td><td>' + esc(r.how) + '</td><td>' + esc(r.expected) + '</td><td>' + (r.result ? esc(r.result) : '<span class="muted">미확인</span>') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  h += '<h3>고지</h3><div class="panel"><p>이 사이트는 비공식 팬 사이트이며 Kinetic Games와 관련이 없습니다. 게임 이미지는 사용하지 않았고 아이콘은 직접 그린 단순 도형입니다. 값마다 출처와 확인 상태를 표시하며, 검증이 끝나지 않은 값에는 배지가 붙습니다.</p></div>';
  return h;
}

/* ---------- 라우터 ---------- */
function route(){
  var p = parseHash(location.hash), part = p.parts[0] || '', app = $('#app'), after = null;
  var r = part;
  if (part === '' ) {
    if (Object.keys(p.params).length) S = stateFromParams(p.params, EVID.map(function(e){ return e.id; }));
    app.innerHTML = viewIdentifier(); after = syncIdentifier;
  }
  else if (part === 'ghost') app.innerHTML = viewGhost(p.parts[1]);
  else if (part === 'ghosts') app.innerHTML = viewGhosts();
  else if (part === 'equipment') app.innerHTML = viewEquipment();
  else if (part === 'cursed') app.innerHTML = viewCursed();
  else if (part === 'maps') app.innerHTML = viewMaps();
  else if (part === 'difficulty') app.innerHTML = viewDifficulty();
  else if (part === 'about') {
    app.innerHTML = viewAbout();
    var id = p.parts[1];
    if (id) after = function(){ var el = document.getElementById(id); if (el) { el.classList.add('hl'); el.scrollIntoView({block: 'start'}); } };
  }
  else { app.innerHTML = '<p class="empty">없는 페이지입니다. <a href="#/">판별기로 이동</a></p>'; r = ''; }
  renderChrome(r);
  if (after) after(); else window.scrollTo(0, 0);
}

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-ev],[data-n],[data-reset],[data-sort]') : null;
  if (!t) return;
  if (t.hasAttribute('data-ev')) { S = cycleEvidence(S, t.getAttribute('data-ev')); syncIdentifier(); }
  else if (t.hasAttribute('data-n')) { S.n = +t.getAttribute('data-n'); syncIdentifier(); }
  else if (t.hasAttribute('data-reset')) { S = {n: 3, yes: [], no: [], q: ''}; syncIdentifier(); }
  else if (t.hasAttribute('data-sort')) {
    var k = t.getAttribute('data-sort');
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
    $('#app').innerHTML = viewGhosts();
  }
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'q') { S.q = e.target.value; syncIdentifier(); }
});
window.addEventListener('hashchange', route);

/* ---------- 테마 ---------- */
function effectiveDark(){
  var t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function paintThemeBtn(){ $('#themebtn').innerHTML = effectiveDark() ? SUN : MOON; }
try { var saved = localStorage.getItem('theme'); if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
$('#themebtn').addEventListener('click', function(){
  var next = effectiveDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  paintThemeBtn();
});
paintThemeBtn();
route();
})();
</script>
